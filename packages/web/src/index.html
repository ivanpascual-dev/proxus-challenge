<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Symma | Estudia con Sym, tú tutor académico</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#793EF9" />
    <script>
      (function () {
        try {
          // Preferencia guardada: "light" | "dark" | "system". Sin nada guardado, o "system",
          // se sigue a prefers-color-scheme. Se resuelve antes de pintar para no parpadear.
          var stored = localStorage.getItem("proxus-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light";
          if (theme === "dark") {
            document.documentElement.setAttribute("data-theme", "dark");
          }
        } catch (error) {
          // Sin localStorage o sin matchMedia: se queda en el tema claro por defecto del CSS.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
